# 포트폴리오 자동 추가
# 새 리포(공개, 또는 토픽 'portfolio'가 붙은 비공개)나 이 저장소의 새 Pages 폴더를 찾아
# Claude Code로 분석 → 화면 캡쳐 → 페이지 빌드 → PR 을 올린다. PR을 Merge하면 사이트에 반영된다.
# 필요한 설정: Secrets CLAUDE_CODE_OAUTH_TOKEN, PORTFOLIO_READ_TOKEN
#             Settings → Actions → Workflow permissions: Read and write + Allow Actions to create PRs
name: 포트폴리오 자동 추가

on:
  schedule:
    - cron: "17 0 * * *"          # 매일 09:17 KST
  push:
    branches: [main]
    paths-ignore:                 # 포트폴리오 자체가 바뀔 때는 돌지 않음
      - "index.html"
      - "sitemap.xml"
      - "work/**"
      - "assets/**"
      - "_portfolio/**"
      - ".github/**"
      - ".gitignore"
      - "robots.txt"
      - ".nojekyll"
  workflow_dispatch:
    inputs:
      only:
        description: "특정 리포/폴더 이름만 추가 (비우면 새로 생긴 것 전부)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 새 후보 찾기
        id: find
        env:
          PORTFOLIO_READ_TOKEN: ${{ secrets.PORTFOLIO_READ_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
          LIMIT: "3"
        run: |
          python3 _portfolio/sync/discover.py > /tmp/candidates.json
          cat /tmp/candidates.json
          echo "count=$(python3 -c 'import json;print(len(json.load(open("/tmp/candidates.json"))))')" >> "$GITHUB_OUTPUT"

      - name: 도구 설치
        if: steps.find.outputs.count != '0'
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          pip install --break-system-packages pillow || pip install pillow

      - name: 분석하고 추가하기
        if: steps.find.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PORTFOLIO_READ_TOKEN: ${{ secrets.PORTFOLIO_READ_TOKEN }}
        run: |
          echo "## 새로 추가한 프로젝트" >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json;[print(json.dumps(c,ensure_ascii=False)) for c in json.load(open("/tmp/candidates.json"))]' > /tmp/list.txt
          ok=0
          while IFS= read -r c; do
            if python3 _portfolio/sync/add_project.py "$c"; then ok=$((ok+1)); else echo "- 실패: $c" >> "$GITHUB_STEP_SUMMARY"; fi
          done < /tmp/list.txt
          echo "added=$ok" >> "$GITHUB_ENV"

      - name: 페이지 다시 만들기
        if: steps.find.outputs.count != '0' && env.added != '0'
        run: python3 _portfolio/build.py

      - name: PR 올리기
        if: steps.find.outputs.count != '0' && env.added != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: portfolio-sync
          delete-branch: true
          commit-message: "Portfolio: auto-add new projects"
          title: "포트폴리오: 새 프로젝트 자동 추가"
          body: |
            새로 찾은 리포/Pages 폴더를 Claude Code로 분석해 포트폴리오 항목을 만들었습니다.
            설명과 캡쳐를 확인하고 Merge하면 사이트에 반영됩니다. 고칠 내용은 `_portfolio/projects.json`에서 수정하세요.
            넣고 싶지 않은 리포는 GitHub 토픽 `no-portfolio`를 붙이면 다음부터 제외됩니다.
          labels: portfolio
